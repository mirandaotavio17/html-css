<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
        }

        th, td {
            border: 2px rgba(0, 0, 0, 0.635) solid;
            padding: 5px;
            text-align: center;
        }
        .back{
            background-color: gray;
            color: white;
            font-weight: bold;
        }
        .hmaterias{
            font-weight: bold;
        }
        .hmedia{
            background-color: gray;
            text-align: left;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th class="back" rowspan="2">Área</th>
                <th class="back" rowspan="2">Disciplinas</th>
                <th class="back" colspan="2">Notas</th>
                <th class="back" rowspan="2">Média</th>
            </tr>
            <tr>
                <th class="back">Nota 1</th>
                <th class="back">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th class="hmateria" rowspan="4">Exatas</th>
                <td>Matémática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th class="hmedia" colspan="4">Média de Exatas</th>
                <td class="back">0.0</td>
            </tr>
            <tr>
                <th class="hmateria" rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th class="hmedia" colspan="4">Média de Humanas</th>
                <td class="back">0.0</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
